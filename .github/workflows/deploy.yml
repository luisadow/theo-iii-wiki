name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HOST: theo3.sadowski-dos-santos.de

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      changed_urls: ${{ steps.diff.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      # Neue Sitemap mit der live stehenden vergleichen: nur neue, geänderte (lastmod)
      # und gelöschte URLs werden später per IndexNow gemeldet.
      - name: Geänderte URLs bestimmen
        id: diff
        run: |
          curl -fsSL "https://$HOST/sitemap.xml" -o old-sitemap.xml || echo "" > old-sitemap.xml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          def entries(path):
              xml = open(path, encoding="utf-8").read()
              return dict(re.findall(r"<loc>([^<]+)</loc>\s*<lastmod>([^<]*)</lastmod>", xml))
          old, new = entries("old-sitemap.xml"), entries("public/sitemap.xml")
          changed = [u for u, m in new.items() if old.get(u) != m]
          removed = [u for u in old if u not in new]
          print("urls=" + json.dumps(changed + removed))
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Nach dem Deploy nur die geänderten URLs per IndexNow melden (Bing, Yandex, Seznam, …).
  # Der Schlüssel ist öffentlich und liegt als content/ad383026f04871bd60ac72bb0b623d16.txt im Wurzelverzeichnis der Seite.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.changed_urls != '[]'
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ad383026f04871bd60ac72bb0b623d16
      URLS: ${{ needs.build.outputs.changed_urls }}
    steps:
      - name: Geänderte URLs an IndexNow melden
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          host, key = os.environ["HOST"], os.environ["INDEXNOW_KEY"]
          urls = json.loads(os.environ["URLS"])
          body = json.dumps({"host": host, "key": key,
                             "keyLocation": f"https://{host}/{key}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req) as r:
              print(f"IndexNow: {len(urls)} geänderte URLs gemeldet, Status {r.status}")
              for u in urls:
                  print("  ", u)
          PY
